<!DOCTYPE html>
<html lang="vi" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Đăng Nhập — Garage VTV Engine Pro</title>
  <meta name="description" content="Trang đăng nhập nội bộ dành cho nhân viên Garage VTV.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Huninn&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080d16;
      --card: #0f172a;
      --border: rgba(255,255,255,0.07);
      --border-focus: rgba(56,189,248,0.5);
      --text: #f8fafc;
      --muted: #94a3b8;
      --light: #64748b;
      --cyan: #38bdf8;
      --red: #f43f5e;
      --amber: #f59e0b;
    }

    html, body {
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', 'Huninn', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
    }

    /* Gradient orbs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      pointer-events: none;
      animation: orbFloat 8s ease-in-out infinite alternate;
    }
    body::before {
      width: 500px; height: 500px;
      top: -120px; right: -100px;
      background: radial-gradient(circle, #0891b2, transparent);
    }
    body::after {
      width: 400px; height: 400px;
      bottom: -100px; left: -80px;
      background: radial-gradient(circle, #4f46e5, transparent);
      animation-delay: -4s;
    }
    @keyframes orbFloat {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(30px,20px) scale(1.1); }
    }

    /* Grid lines */
    .grid-bg {
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.022) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
    }

    /* Wrapper */
    .login-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      animation: slideUp 0.45s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Back link */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 1.5rem;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--cyan); }

    /* Card */
    .login-card {
      background: rgba(15,23,42,0.93);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.25rem 2rem;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03) inset;
      backdrop-filter: blur(20px);
    }

    /* Brand */
    .brand-section { text-align: center; margin-bottom: 2rem; }
    .brand-logo {
      height: 68px; width: auto; object-fit: contain;
      display: block; margin: 0 auto 0.9rem;
      filter: drop-shadow(0 0 18px rgba(8,145,178,0.5));
      animation: logoGlow 3s ease-in-out infinite alternate;
    }
    @keyframes logoGlow {
      from { filter: drop-shadow(0 0 10px rgba(8,145,178,0.35)); }
      to   { filter: drop-shadow(0 0 22px rgba(8,145,178,0.65)); }
    }
    .brand-title {
      font-family: 'Huninn', sans-serif;
      font-size: 1.45rem; font-weight: 800;
      color: var(--text); letter-spacing: 0.04em;
    }
    .brand-title span {
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-sub {
      font-size: 0.74rem; color: var(--muted);
      font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; margin-top: 0.3rem;
    }

    /* Role cards */
    .role-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.6rem;
      margin-bottom: 1.25rem;
    }
    .role-card {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.65rem 0.8rem;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.07);
      background: rgba(255,255,255,0.02);
      cursor: pointer;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .role-card:hover { 
      border-color: rgba(56,189,248,0.4); 
      background: rgba(56,189,248,0.06); 
      transform: translateY(-2px);
    }
    .role-card.selected {
      border-color: rgba(56,189,248,0.6);
      background: rgba(56,189,248,0.12);
      box-shadow: 0 4px 14px rgba(56,189,248,0.15), 0 0 0 1px rgba(56,189,248,0.2) inset;
      transform: translateY(-2px);
    }
    .role-card input { position: absolute; opacity: 0; width: 0; height: 0; }

    .role-icon {
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; flex-shrink: 0;
    }
    .role-icon.blue   { background: rgba(59,130,246,0.18); color: #60a5fa; }
    .role-icon.green  { background: rgba(16,185,129,0.18); color: #34d399; }
    .role-icon.amber  { background: rgba(245,158,11,0.18); color: #fbbf24; }
    .role-icon.purple { background: rgba(139,92,246,0.18); color: #c084fc; }

    .role-info { flex: 1; overflow: hidden; }
    .role-name { font-size: 0.8rem; font-weight: 700; color: var(--text); }
    .role-desc { font-size: 0.68rem; color: var(--muted); }

    .role-check {
      width: 15px; height: 15px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.15s;
    }
    .role-card.selected .role-check {
      background: var(--cyan); border-color: var(--cyan);
    }
    .role-card.selected .role-check::after {
      content: ''; width: 5px; height: 5px;
      border-radius: 50%; background: white;
    }

    /* Form */
    .form-label {
      display: block; font-size: 0.78rem; font-weight: 700;
      color: var(--muted); margin-bottom: 0.45rem;
    }
    .input-wrap { position: relative; margin-bottom: 1.5rem; }
    .input-icon {
      position: absolute; left: 1rem; top: 50%;
      transform: translateY(-50%); color: var(--light);
      font-size: 0.85rem; pointer-events: none;
    }
    .form-input {
      width: 100%;
      background: rgba(15,23,42,0.8);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 12px;
      color: var(--text);
      font-family: inherit; font-size: 0.9rem; font-weight: 500;
      padding: 0.8rem 2.8rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(56,189,248,0.1);
    }
    .form-input::placeholder { color: var(--light); }

    .pwd-toggle {
      position: absolute; right: 0.85rem; top: 50%;
      transform: translateY(-50%);
      background: none; border: none; color: var(--light);
      cursor: pointer; padding: 0.25rem; font-size: 0.85rem;
      transition: color 0.2s; line-height: 1;
    }
    .pwd-toggle:hover { color: var(--cyan); }

    /* Error message inline */
    .error-msg {
      display: none;
      align-items: center;
      gap: 0.5rem;
      background: rgba(244,63,94,0.1);
      border: 1px solid rgba(244,63,94,0.25);
      border-radius: 10px;
      padding: 0.7rem 0.9rem;
      font-size: 0.83rem;
      color: #fda4af;
      margin-bottom: 1rem;
      animation: fadeIn 0.2s ease;
    }
    .error-msg.show { display: flex; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

    /* Submit button */
    .btn-login {
      width: 100%;
      display: flex; align-items: center; justify-content: center; gap: 0.6rem;
      padding: 0.88rem 1.5rem;
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 60%, #818cf8 100%);
      color: white; border: none; border-radius: 12px;
      font-family: inherit; font-size: 0.95rem; font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(79,70,229,0.4);
      letter-spacing: 0.02em;
      position: relative; overflow: hidden;
    }
    .btn-login::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.18), transparent);
      opacity: 0; transition: opacity 0.2s;
    }
    .btn-login::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        60deg,
        transparent 25%,
        rgba(255, 255, 255, 0.25) 50%,
        transparent 75%
      );
      transform: rotate(25deg);
      animation: shimmerSweep 4.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }
    @keyframes shimmerSweep {
      0% { transform: translateX(-120%) rotate(25deg); }
      100% { transform: translateX(250%) rotate(25deg); }
    }
    .btn-login:hover::before { opacity: 1; }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(79,70,229,0.55); }
    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* Shake */
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .shake { animation: shake 0.35s ease; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 0.8s linear infinite; }

    /* Footer */
    .login-footer {
      text-align: center; margin-top: 1.25rem;
      font-size: 0.78rem; color: var(--light);
    }
    .login-footer a { color: var(--cyan); text-decoration: none; font-weight: 600; }
    .login-footer a:hover { text-decoration: underline; }
  </style>
</head>

<body>
  <div class="grid-bg"></div>

  <div class="login-wrap">

    <a href="customer.html" class="back-link">
      <i class="fa-solid fa-arrow-left"></i> Về Cổng Khách Hàng
    </a>

    <div class="login-card">

      <!-- Brand -->
      <div class="brand-section">
        <img src="logo.png" alt="Garage VTV Logo" class="brand-logo">
        <h1 class="brand-title">GARAGE <span>VTV</span></h1>
        <p class="brand-sub">Đăng nhập hệ thống nội bộ</p>
      </div>

      <!-- Role cards -->
      <div style="font-size: 0.78rem; font-weight: 700; color: var(--muted); margin-bottom: 0.5rem;">
        <i class="fa-solid fa-user-gear" style="margin-right: 0.3rem;"></i> Chọn vai trò
      </div>
      <div class="role-grid">
        <label class="role-card selected" data-role="receptionist" onclick="selectRole('receptionist',this)">
          <input type="radio" name="role" value="receptionist" checked>
          <div class="role-icon green"><i class="fa-solid fa-headset"></i></div>
          <div class="role-info">
            <div class="role-name">Lễ Tân</div>
            <div class="role-desc">Receptionist</div>
          </div>
          <div class="role-check"></div>
        </label>

        <label class="role-card" data-role="manager" onclick="selectRole('manager',this)">
          <input type="radio" name="role" value="manager">
          <div class="role-icon blue"><i class="fa-solid fa-user-tie"></i></div>
          <div class="role-info">
            <div class="role-name">Quản Lý</div>
            <div class="role-desc">Admin</div>
          </div>
          <div class="role-check"></div>
        </label>

        <label class="role-card" data-role="technician" onclick="selectRole('technician',this)">
          <input type="radio" name="role" value="technician">
          <div class="role-icon amber"><i class="fa-solid fa-screwdriver-wrench"></i></div>
          <div class="role-info">
            <div class="role-name">Kỹ Thuật</div>
            <div class="role-desc">Technician</div>
          </div>
          <div class="role-check"></div>
        </label>

        <label class="role-card" data-role="cashier" onclick="selectRole('cashier',this)">
          <input type="radio" name="role" value="cashier">
          <div class="role-icon purple"><i class="fa-solid fa-cash-register"></i></div>
          <div class="role-info">
            <div class="role-name">Thu Ngân</div>
            <div class="role-desc">Cashier</div>
          </div>
          <div class="role-check"></div>
        </label>
      </div>

      <!-- Password -->
      <label class="form-label" for="staff-password">
        <i class="fa-solid fa-lock" style="margin-right: 0.3rem;"></i> Mật Khẩu
      </label>
      <div class="input-wrap">
        <i class="fa-solid fa-key input-icon"></i>
        <input
          type="password"
          id="staff-password"
          class="form-input"
          placeholder="Nhập mật khẩu..."
          autocomplete="current-password"
          onkeydown="if(event.key==='Enter') doLogin()">
        <button type="button" class="pwd-toggle" onclick="togglePwd()" title="Ẩn/Hiện">
          <i class="fa-solid fa-eye" id="pwd-eye"></i>
        </button>
      </div>

      <!-- Error message -->
      <div class="error-msg" id="error-msg">
        <i class="fa-solid fa-circle-exclamation" style="color: #f43f5e; flex-shrink:0;"></i>
        <span id="error-text">Sai mật khẩu. Vui lòng thử lại.</span>
      </div>

      <!-- Submit -->
      <button id="btn-login" class="btn-login" onclick="doLogin()">
        <i class="fa-solid fa-right-to-bracket" id="btn-icon"></i>
        <span id="btn-text">Đăng Nhập</span>
      </button>

    </div>

    <div class="login-footer">
      Hỗ trợ kỹ thuật: <a href="tel:0333442358">033.344.2358</a>
    </div>

  </div>

  <script>
    const API_BASE = (
      window.location.origin.includes('localhost') ||
      window.location.origin.includes('127.0.0.1')
    ) ? 'http://127.0.0.1:8000/api/v1' : '/api/v1';

    let selectedRole = 'receptionist';

    function selectRole(role, el) {
      selectedRole = role;
      document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      hideError();
      document.getElementById('staff-password').focus();
    }

    function togglePwd() {
      const inp  = document.getElementById('staff-password');
      const icon = document.getElementById('pwd-eye');
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      icon.className = show ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
    }

    function showError(msg) {
      const box  = document.getElementById('error-msg');
      const text = document.getElementById('error-text');
      text.textContent = msg;
      box.classList.add('show');
      // Shake card
      const card = document.querySelector('.login-card');
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
      setTimeout(() => card.classList.remove('shake'), 400);
    }

    function hideError() {
      document.getElementById('error-msg').classList.remove('show');
    }

    const CREDS = {
      manager:      { username: 'admin' },
      receptionist: { username: 'letan' },
      technician:   { username: 'kythuat' },
      cashier:      { username: 'thungan' }
    };

    function setLoading(on) {
      const btn  = document.getElementById('btn-login');
      const icon = document.getElementById('btn-icon');
      const txt  = document.getElementById('btn-text');
      btn.disabled = on;
      icon.className = on ? 'fa-solid fa-spinner spin' : 'fa-solid fa-right-to-bracket';
      txt.textContent = on ? 'Đang đăng nhập...' : 'Đăng Nhập';
    }

    async function doLogin() {
      const pass = (document.getElementById('staff-password').value || '').trim();
      if (!pass) {
        showError('Vui lòng nhập mật khẩu.');
        document.getElementById('staff-password').focus();
        return;
      }

      hideError();
      setLoading(true);

      const roleInfo = CREDS[selectedRole] || CREDS.manager;
      // Authentication is always performed by FastAPI. Never create a local
      // session or trust a password list embedded in this public HTML.
      try {
        const body = new URLSearchParams({
          username: roleInfo.username,
          password: pass
        });
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), 10000);
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body,
          signal: ctrl.signal
        }).catch(() => null);
        clearTimeout(t);

        if (!res || !res.ok) {
          const detail = res ? await res.json().catch(() => ({})) : {};
          throw new Error(detail.detail || 'Không thể kết nối máy chủ xác thực.');
        }
        const data = await res.json();
        if (!data.access_token) throw new Error('Máy chủ không trả token hợp lệ.');
        if (data.user?.role && data.user.role !== selectedRole) {
          throw new Error('Tài khoản không thuộc vai trò đã chọn.');
        }
        localStorage.setItem('garage_access_token', data.access_token);
      } catch (err) {
        setLoading(false);
        showError(err.message || 'Đăng nhập thất bại.');
        return;
      }

      // Thiết lập thông tin phiên đăng nhập
      localStorage.setItem('garage_user_role', selectedRole);
      localStorage.setItem('garage_is_logged_in', 'true');

      // Chuyển hướng mượt mà
      setTimeout(() => {
        window.location.href = 'admin.html';
      }, 250);
    }

    // Khôi phục role đã chọn lần trước
    (function restoreRole() {
      const saved = localStorage.getItem('garage_user_role');
      if (saved && CREDS[saved]) {
        selectedRole = saved;
        document.querySelectorAll('.role-card').forEach(c => {
          c.classList.toggle('selected', c.dataset.role === saved);
        });
      }
      document.getElementById('staff-password').focus();
    })();
  </script>
</body>
</html>
