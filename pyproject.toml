[project]
name = "garage-vtv"
version = "1.0.0"
description = "Hệ thống Quản lý Garage Ô tô Tích hợp AI (FastAPI + Streamlit + Modern SPA)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-jose>=3.3.0",
    "passlib>=1.7.4",
    "python-multipart>=0.0.6",
    "httpx>=0.24.0",
    "requests>=2.31.0",
    "email-validator>=2.0.0",
    "pg8000>=1.30.0",
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "plotly>=5.18.0"
]

[tool.vercel]
entrypoint = "api/index.py"
